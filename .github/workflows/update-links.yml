name: Bulk Update Website Links

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Find and Replace Old Links
        run: |
          # We use grep -I to ignore binary files (images/pdfs) so the script doesn't crash.
          # The "|| true" at the end prevents the step from failing if a link isn't found.
          
          grep -rlI --exclude-dir=.git "https://www.facebook.com/Beyondthecrisis" . | xargs -r sed -i 's#https://www.facebook.com/Beyondthecrisis#https://www.facebook.com/scasf_1#g' || true

          grep -rlI --exclude-dir=.git "https://www.instagram.com/beyond_the_crisis" . | xargs -r sed -i 's#https://www.instagram.com/beyond_the_crisis#https://www.instagram.com/scasf_1#g' || true

          grep -rlI --exclude-dir=.git "sicklecellawarenessfoundation.org/community" . | xargs -r sed -i 's#sicklecellawarenessfoundation.org/community#sicklecellawarenessfoundation.org/impact#g' || true

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add .
          
          # Check if any files were modified
          if ! git diff --staged --quiet; then
            git commit -m "Update social media and impact links across all pages"
            # Attempt to push. If it fails, print a helpful error message.
            git push || { echo "❌ Failed to push. You likely have Branch Protection rules enabled on 'main' preventing direct pushes."; exit 1; }
          else
            echo "✅ No old links were found. They may have already been updated, or the text didn't match exactly."
          fi
