name: Update Social Media Icons

on:
  workflow_dispatch: 

permissions:
  contents: write 

jobs:
  update-socials:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create and Run Python Script
        run: |
          cat << 'EOF' > update_socials.py
          import os
          import re

          # This is the exact HTML that will replace the old socials
          new_socials_html = """<div class="footer-socials">
                      <a href="https://facebook.com/Beyondthecrisis" target="_blank" aria-label="Facebook">
                          <svg viewBox="0 0 24 24"><path d="M22 12c0-5.523-4.477-10-10-10S2 6.477 2 12c0 4.991 3.657 9.128 8.438 9.878v-6.987h-2.54V12h2.54V9.797c0-2.506 1.492-3.89 3.777-3.89 1.094 0 2.238.195 2.238.195v2.46h-1.26c-1.243 0-1.63.771-1.63 1.562V12h2.773l-.443 2.89h-2.33v6.988C18.343 21.128 22 16.991 22 12z"></path></svg>
                      </a>
                      <a href="https://x.com/beyondthcrisis" target="_blank" aria-label="X (Twitter)">
                          <svg viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"></path></svg>
                      </a>
                      <a href="https://instagram.com/beyond_the_crisis" target="_blank" aria-label="Instagram">
                          <svg viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zM12 16a4 4 0 110-8 4 4 0 010 8zm6.406-11.845a1.44 1.44 0 100 2.881 1.44 1.44 0 000-2.881z"></path></svg>
                      </a>
                      <a href="https://www.youtube.com/@beyond_the_crisis" target="_blank" aria-label="YouTube">
                          <svg viewBox="0 0 24 24"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"></path></svg>
                      </a>
                      <a href="https://tiktok.com/@beyond_the_crisis" target="_blank" aria-label="TikTok">
                          <svg viewBox="0 0 24 24"><path d="M12.525.02c1.31-.02 2.61-.01 3.91-.04.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93-.01 2.92.01 5.84-.02 8.75-.08 2.26-1.17 4.54-3.04 5.92-1.9 1.4-4.52 1.83-6.73 1.05-2.52-.89-4.27-3.41-4.21-6.14.05-2.61 1.79-5.11 4.26-5.87 1.25-.38 2.61-.39 3.88-.13v4.06c-1.39-.33-2.92-.09-3.99.9-1.28 1.2-1.29 3.42-.03 4.58 1.08 1 2.74 1.15 4.09.43 1.54-.83 2.13-2.67 2.1-4.32V.02h-2.69z"></path></svg>
                      </a>
                  </div>"""

          # Regex to find everything from <div class="footer-socials"> to its closing </div>
          pattern = re.compile(r'<div class="footer-socials">.*?</div>', re.DOTALL)

          for root, dirs, files in os.walk("."):
              for file in files:
                  if file.endswith(".html"):
                      filepath = os.path.join(root, file)
                      with open(filepath, "r", encoding="utf-8") as f:
                          content = f.read()
                      
                      # Check if this file already has the YouTube link (prevent doing it twice)
                      if "youtube.com/@beyond_the_crisis" in content:
                          print(f"Skipping {filepath} (Already updated)")
                          continue
                      
                      # If the footer-socials div exists, replace it
                      if '<div class="footer-socials">' in content:
                          new_content = pattern.sub(new_socials_html, content)
                          with open(filepath, "w", encoding="utf-8") as f:
                              f.write(new_content)
                          print(f"Updated {filepath}")
          EOF
          
          # Run the python script we just generated
          python update_socials.py
          
          # Clean up the script file
          rm update_socials.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          
          if ! git diff-index --quiet HEAD; then
            git commit -m "Auto-update footer social media links and SVGs"
            git push
            echo "Successfully updated the social media links!"
          else
            echo "No files needed updating."
          fi
